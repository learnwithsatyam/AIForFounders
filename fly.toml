# fly.toml app configuration file generated for aiforfounders on 2026-08-02T03:42:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aiforfounders'
primary_region = 'sin'
kill_signal = 'SIGINT'
kill_timeout = '30s'
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
